<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main class="container py-3">
    <h1 th:text="${formTitle}">Add Movie</h1>

    <form th:action="@{${formAction}}" th:object="${movie}" method="post">
        <input type="hidden" th:field="*{id}">

        <p class="text-danger" th:text="${globalErrorMessage}">Error</p>


        <div>
            <label class="form-label" for="title">Title</label>
            <input id="title" type="text" class="form-control" th:field="*{title}">
            <div class="text-danger small" th:errors="*{title}">Title error</div>
        </div>

        <div>
            <label class="form-label" for="director">Director</label>
            <input id="director" type="text" class="form-control" th:field="*{director}">
            <div class="text-danger small" th:errors="*{director}">Director error</div>
        </div>

        <div>
            <label class="form-label" for="releaseYear">Release Year</label>
            <input id="releaseYear" type="number" min="1888" class="form-control" th:field="*{releaseYear}">
            <div class="text-danger small" th:errors="*{releaseYear}">Year error</div>
        </div>

        <div>
            <label class="form-label" for="genre">Genre</label>
            <input id="genre" type="text" class="form-control" th:field="*{genre}">
            <div class="text-danger small" th:errors="*{genre}">Genre error</div>
        </div>

        <div>
            <label class="form-label" for="rating">Rating (0-10)</label>
            <input id="rating" type="number" min="0" max="10" class="form-control" th:field="*{rating}">
            <div class="text-danger small" th:errors="*{rating}">Rating error</div>
        </div>

        <div>
            <label class="form-label" for="durationMinutes">Duration (minutes)</label>
            <input id="durationMinutes" type="number" min="1" class="form-control" th:field="*{durationMinutes}">
            <div class="text-danger small" th:errors="*{durationMinutes}">Duration error</div>
        </div>

        <button type="submit" class="btn btn-primary" th:text="${submitLabel}">Add Movie</button>
    </form>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>

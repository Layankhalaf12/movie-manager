<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main class="container py-3">
    <h1>Confirm Delete</h1>

    <p>Are you sure you want to delete this movie?</p>

    <table class="table table-bordered w-auto">
        <tbody>
        <tr>
            <th scope="row">Title</th>
            <td th:text="${movie.title}">Title</td>
        </tr>
        <tr>
            <th scope="row">Director</th>
            <td th:text="${movie.director}">Director</td>
        </tr>
        <tr>
            <th scope="row">Year</th>
            <td th:text="${movie.releaseYear}">Year</td>
        </tr>
        <tr>
            <th scope="row">Genre</th>
            <td th:text="${movie.genre}">Genre</td>
        </tr>
        <tr>
            <th scope="row">Rating</th>
            <td th:text="${movie.rating}">Rating</td>
        </tr>
        <tr>
            <th scope="row">Duration</th>
            <td><span th:text="${movie.durationMinutes}">Duration</span> min</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/movies/delete}" method="post">
        <input type="hidden" name="id" th:value="${movie.id}">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a class="btn btn-secondary" th:href="@{/movies}">Cancel</a>
    </form>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>

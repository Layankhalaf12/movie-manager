<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main class="container py-3">
    <h1>Search Movies</h1>

    <form th:action="@{/movies/search}" method="get">
        <div>
            <label class="form-label" for="title">Title contains</label>
            <input id="title" type="text" class="form-control" name="title" th:value="${title}">
        </div>
        <div>
            <label class="form-label" for="genre">Genre contains</label>
            <input id="genre" type="text" class="form-control" name="genre" th:value="${genre}">
        </div>
        <div>
            <label class="form-label" for="minRating">Minimum rating</label>
            <input id="minRating" type="number" min="1" max="10" class="form-control" name="minRating" th:value="${minRating}">
        </div>
        <button type="submit" class="btn btn-sm btn-outline-primary">Search</button>
    </form>

    <div>
        <p th:text="${searchMessage}"></p>

        <table class="table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Director</th>
                <th>Year</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Duration (min)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${results}">
                <td th:text="${movie.title}">Title</td>
                <td th:text="${movie.director}">Director</td>
                <td th:text="${movie.releaseYear}">Year</td>
                <td th:text="${movie.genre}">Genre</td>
                <td th:text="${movie.rating}">Rating</td>
                <td th:text="${movie.durationMinutes}">Duration</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>

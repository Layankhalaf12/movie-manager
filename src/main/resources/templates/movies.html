<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main class="container py-3">
    <h1>Movies</h1>

    <p class="text-success" th:text="${successMessage}"></p>
    <p class="text-danger" th:text="${errorMessage}"></p>

    <p class="text-muted" th:text="${moviesMessage}"></p>

    <table class="table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Director</th>
            <th>Year</th>
            <th>Genre</th>
            <th>Rating</th>
            <th>Duration (min)</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="movie : ${movies}">
            <td th:text="${movie.title}">Title</td>
            <td th:text="${movie.director}">Director</td>
            <td th:text="${movie.releaseYear}">Year</td>
            <td th:text="${movie.genre}">Genre</td>
            <td th:text="${movie.rating}">Rating</td>
            <td th:text="${movie.durationMinutes}">Duration</td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/movies/details/{id}(id=${movie.id})}">View</a>
                <a class="btn btn-sm btn-secondary" th:href="@{/movies/edit/{id}(id=${movie.id})}">Edit</a>
                <a class="btn btn-sm btn-danger" th:href="@{/movies/delete/{id}(id=${movie.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
